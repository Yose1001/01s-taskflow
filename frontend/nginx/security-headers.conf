# Sent with every response. Included in each location because nginx does NOT inherit add_header
# into a location that has its own add_header.
#
# Strict-Transport-Security is deliberately not here: it only makes sense over HTTPS, so it belongs to
# whatever terminates TLS in front of this container (see docs/deployment.md).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
