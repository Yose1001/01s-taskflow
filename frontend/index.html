<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TaskFlow</title>
    <!--
      Picks the theme BEFORE the first paint so a dark-mode user never sees a white flash.
      It is a separate file (not inline) so the server can forbid inline scripts (Content-Security-Policy).
      Keep in sync with src/theme/theme.ts (same storage key 'tf-theme').
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
