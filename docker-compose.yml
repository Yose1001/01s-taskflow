name: taskflow # คงชื่อ compose project ไว้ ไม่ขึ้นกับชื่อโฟลเดอร์ (01-taskflow)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taskflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-taskflow} -d $${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taskflow_pgdata:
