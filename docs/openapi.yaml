openapi: 3.0.3
info:
  title: TaskFlow API
  version: 0.5.0
  description: |
    REST API ของ TaskFlow (ฉบับร่างรออนุมัติ)

    - ข้อผิดพลาดทุกกรณีคืน `code` (เช่น `not_found`, `email_taken`, `validation_failed`) ให้ frontend แปลตามภาษาที่ผู้ใช้เลือก
      ฟิลด์ `message` เป็นภาษาอังกฤษสำหรับนักพัฒนาเท่านั้น
    - ข้อมูลที่ถูกลบอยู่ในถังขยะ 30 วัน (ดูฟิลด์ `purgeAt`) แล้วถูกลบถาวรโดยอัตโนมัติ
    - Request body เป็น JSON object เดียว ไม่เกิน 1 MiB ห้ามมีฟิลด์ที่ไม่รู้จัก (ผิดคืน 400 `bad_request`, ใหญ่เกินคืน 413)
    - `POST /auth/login` จำกัด 10 ครั้ง/นาที และ `POST /auth/register` 5 ครั้ง/นาที ต่อ IP เกินคืน 429 `rate_limited` พร้อม `Retry-After`
    - ล็อกอินผิดทุกกรณี (ไม่มีอีเมล / รหัสผิด) คืนข้อความเดียวกัน `invalid_credentials`
servers:
  - url: http://localhost:8080/api/v1
tags:
  - name: Auth
  - name: Projects
  - name: Members
  - name: Tasks
  - name: Calendar

paths:
  /ready:
    get:
      summary: Readiness probe (ตรวจว่าเชื่อมฐานข้อมูลได้; 503 ถ้าเชื่อมไม่ได้)
      security: []
      responses:
        "200":
          description: พร้อมให้บริการ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
        "503":
          description: ฐานข้อมูลเชื่อมต่อไม่ได้ (ไม่เปิดเผยรายละเอียด)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: unavailable }

  /health:
    get:
      summary: Liveness probe (ไม่แตะฐานข้อมูล)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /auth/register:
    post:
      tags: [Auth]
      summary: สมัครสมาชิก
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /auth/login:
    post:
      tags: [Auth]
      summary: เข้าสู่ระบบ
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: |
            สำเร็จ และตั้ง cookie `taskflow_refresh` (HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth, อายุ 30 วันนับจากการใช้ล่าสุด)
            ไว้ขอ access token ใหม่หลัง reload หน้า
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: ขอ access token ใหม่ด้วย refresh cookie (ใช้ตอน reload หน้า หรือก่อน token เดิมหมดอายุ)
      description: |
        ไม่มี body ใช้ cookie `taskflow_refresh` แทน token. ทุกครั้งที่ใช้ cookie จะถูกเปลี่ยนเป็นค่าใหม่ (rotation).
        ถ้า 2 แท็บส่ง cookie เดิมพร้อมกัน ภายใน 30 วินาทีจะได้ token ทั้งคู่ (แท็บหลังไม่ได้ cookie ใหม่).
        ถ้ามีคนใช้ cookie เก่าหลังจากนั้น ถือว่าอาจถูกขโมย: session นั้นถูกยกเลิกทั้งหมด.
      security: []
      responses:
        "200":
          description: สำเร็จ (อาจตั้ง cookie ใหม่)
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401":
          description: ไม่มี cookie, หมดอายุ, ถูก logout แล้ว หรือถูกยกเลิก (cookie ถูกลบ)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: ออกจากระบบ (ยกเลิก session บน server และลบ cookie)
      security: []
      responses:
        "204":
          description: เรียบร้อย (ไม่มี cookie ก็ได้ 204 เหมือนกัน)

  /me:
    get:
      tags: [Auth]
      summary: ข้อมูลผู้ใช้ปัจจุบัน
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Auth]
      summary: ตั้งค่าส่วนตัว (ชื่อที่แสดง ภาษา ธีม)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserSettingsPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /projects:
    get:
      tags: [Projects]
      summary: รายการโปรเจกต์ที่ฉันเป็นสมาชิก (trashed=true = ถังขยะ เฉพาะที่ฉันเป็น Owner)
      parameters:
        - { name: trashed, in: query, schema: { type: boolean, default: false } }
        - name: sort
          in: query
          description: >-
            การเรียง โปรเจกต์ที่ไม่มีงานจะอยู่ท้ายสุดเมื่อเรียงตามความคืบหน้า updated = มีการเปลี่ยนแปลงล่าสุดก่อน
            (ตัวโปรเจกต์หรืองานในนั้น) name = ชื่อ ก-ฮ / A-Z ถังขยะไม่ใช้ค่านี้
          schema:
            type: string
            enum: [newest, oldest, updated, name, progress_high, progress_low]
            default: newest
        - name: person
          in: query
          description: เฉพาะโปรเจกต์ที่คนนี้มีงาน (ที่ไม่อยู่ในถังขยะ) ถังขยะไม่ใช้ค่านี้ ผิดรูปแบบคืน 422 `fields.person` = `invalid_id`
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Projects]
      summary: สร้างโปรเจกต์ (ผู้สร้างเป็น Owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Projects]
      summary: ดูโปรเจกต์
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Projects]
      summary: แก้ไขโปรเจกต์ (Owner เท่านั้น)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Projects]
      summary: ย้ายโปรเจกต์ไปถังขยะ เก็บ 30 วัน (Owner เท่านั้น)
      responses:
        "204": { description: ย้ายไปถังขยะแล้ว }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/restore:
    post:
      tags: [Projects]
      summary: กู้คืนโปรเจกต์จากถังขยะ (Owner เท่านั้น ภายใน 30 วัน)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: กู้คืนแล้ว
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Members]
      summary: รายชื่อสมาชิก
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Members]
      summary: เพิ่มสมาชิกด้วยอีเมล (Owner เท่านั้น)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "201":
          description: เพิ่มแล้ว
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /projects/{projectId}/members/{userId}:
    delete:
      tags: [Members]
      summary: ลบสมาชิก (Owner เท่านั้น; ลบ Owner ไม่ได้)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: ลบแล้ว }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Tasks]
      summary: รายการงานในโปรเจกต์ (กรองได้; trashed=true = ถังขยะของโปรเจกต์)
      description: |
        เรียงตามคอลัมน์ (todo, in_progress, review, on_hold, done) แล้วตาม `position` ในคอลัมน์นั้น
        (`position` ใช้เทียบได้เฉพาะภายในคอลัมน์เดียวกัน) ถังขยะเรียงตามเวลาที่ลบ ใหม่สุดก่อน
        ค้นหา `q` เป็นการหาข้อความในชื่อ ไม่สนตัวพิมพ์เล็ก/ใหญ่ และอักขระ `%` `_` ถือเป็นตัวอักษรธรรมดา
      parameters:
        - { name: trashed, in: query, schema: { type: boolean, default: false } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/Priority" } }
        - { name: assigneeId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: ค้นหาในชื่องาน, schema: { type: string, maxLength: 100 } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Tasks]
      summary: สร้างงาน
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: สร้างสำเร็จ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      summary: ดูงาน
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tasks]
      summary: แก้ไขงาน (ส่งเฉพาะฟิลด์ที่เปลี่ยน)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Tasks]
      summary: ย้ายงานไปถังขยะ เก็บ 30 วัน (สมาชิกทุกคน)
      responses:
        "204": { description: ย้ายไปถังขยะแล้ว }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/restore:
    post:
      tags: [Tasks]
      summary: กู้คืนงานจากถังขยะ (สมาชิกทุกคน ภายใน 30 วัน)
      description: ผู้รับผิดชอบที่ไม่ได้เป็นสมาชิกแล้วจะไม่อยู่ใน `assigneeIds`
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: กู้คืนแล้ว
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tasks/{taskId}/move:
    post:
      tags: [Tasks]
      summary: ย้ายงานข้ามคอลัมน์/เรียงลำดับใหม่ (drag-and-drop)
      description: |
        `beforeTaskId` ต้องเป็นงานที่ยังไม่ถูกลบ อยู่ในโปรเจกต์เดียวกัน และอยู่ในคอลัมน์ปลายทาง
        และต้องไม่ใช่งานนี้เอง มิฉะนั้นคืน 422 (`fields.beforeTaskId` = `invalid_before_task`)
        ถ้าส่ง null หรือไม่ส่ง งานจะไปอยู่ท้ายคอลัมน์
        สถานะ (`status`) เปลี่ยนได้ทางนี้เท่านั้น ส่ง `status` ผ่าน PATCH จะถูกปฏิเสธ (400)
        ย้ายเข้า `on_hold` ต้องส่ง `holdReason` (มิฉะนั้นคืน 422) งานที่พักอยู่แล้วเรียงลำดับใหม่ได้โดยไม่ต้องส่ง
        ย้ายไปคอลัมน์อื่นจะล้างสาเหตุออก
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/TaskStatus" }
                beforeTaskId:
                  type: string
                  format: uuid
                  nullable: true
                  description: วางหน้างานนี้ (null = ท้ายคอลัมน์)
                holdReason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: สาเหตุที่พักงาน
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /tasks/{taskId}/subtasks:
    post:
      tags: [Tasks]
      summary: เพิ่มรายการย่อยไว้ท้ายรายการของงาน (งานละไม่เกิน 100 รายการ)
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subtask" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /tasks/{taskId}/subtasks/{subtaskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
      - { name: subtaskId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Tasks]
      summary: แก้ชื่อรายการย่อย หรือติ๊กว่าทำแล้ว/ยังไม่ทำ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                done: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subtask" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Tasks]
      summary: ลบรายการย่อยถาวร (รายการย่อยไม่มีถังขยะของตัวเอง)
      responses:
        "204": { description: ลบแล้ว }
        "404": { $ref: "#/components/responses/NotFound" }

  /calendar:
    get:
      tags: [Calendar]
      summary: วันสำคัญและงานที่มีวันที่ ในช่วงวันที่ที่ขอ (รวมทั้งสองวัน)
      description: |
        คืนวันสำคัญส่วนตัวของผู้ใช้ และวันสำคัญของทุกโปรเจกต์ที่เป็นสมาชิก (โปรเจกต์ที่อยู่ในถังขยะไม่แสดง)
        พร้อมงานที่วันเริ่มหรือวันสิ้นสุดอยู่ในช่วง หรือคร่อมทั้งช่วง (สูงสุด 500 งาน)
        ช่วงยาวได้ไม่เกิน 100 วัน ผิดคืน 422: `fields.from`/`fields.to` = `invalid_date`, `before_from`, `range_too_long`
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/Event" } }
                  tasks: { type: array, items: { $ref: "#/components/schemas/CalendarTask" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /events:
    post:
      tags: [Calendar]
      summary: เพิ่มวันสำคัญ (ส่วนตัว หรือของโปรเจกต์ที่เป็นสมาชิก)
      description: |
        ไม่ส่ง `projectId` = วันสำคัญส่วนตัว ส่ง `projectId` = สมาชิกทุกคนเห็นและได้รับการแจ้งเตือน
        วันส่วนตัวแชร์ให้คนที่อยู่โปรเจกต์เดียวกับเจ้าของได้ (`sharedWith` ดู `GET /people`) คนที่ถูกแชร์เห็นและได้รับการแจ้งเตือน
        แต่แก้ไม่ได้ ผิดคืน 422: `fields.sharedWith` = `not_a_member`, `personal_only` (ส่งพร้อม `projectId`), `too_many_people` (เกิน 50), `invalid_id`
        โปรเจกต์ที่ไม่ได้เป็นสมาชิกหรืออยู่ในถังขยะคืน 422 (`fields.projectId` = `not_a_member`)
        `remindDays` เลือกได้จาก 0 (วันนั้น), 1, 3, 7 วันก่อน แจ้งเตือนเวลา 08:00 น. เวลาประเทศไทย
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /events/{eventId}:
    patch:
      tags: [Calendar]
      summary: แก้วันสำคัญ (ย้ายไปเป็นของที่อื่นไม่ได้)
      description: |
        วันส่วนตัวแก้ได้เฉพาะเจ้าของ วันของโปรเจกต์แก้ได้โดยคนที่เพิ่มหรือเจ้าของโปรเจกต์ สมาชิกคนอื่นคืน 403
        เลื่อนวันแล้วการแจ้งเตือนเดิมของวันเก่าจะถูกลบ เพื่อให้เตือนตามวันใหม่ได้
        `sharedWith` แทนที่รายชื่อเดิมทั้งหมด (ส่ง [] = เลิกแชร์) เฉพาะเจ้าของวันส่วนตัว มิฉะนั้นคืน 422 `personal_only`
      parameters:
        - $ref: "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventPatch" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Calendar]
      summary: ลบวันสำคัญถาวร (พร้อมการแจ้งเตือนของวันนั้น ไม่มีถังขยะ)
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /people:
    get:
      tags: [Calendar]
      summary: คนที่แชร์วันสำคัญให้ได้ (ทุกคนที่อยู่โปรเจกต์ที่ยังไม่อยู่ในถังขยะเดียวกับผู้ใช้ ไม่รวมตัวเอง สูงสุด 500)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Person" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /notifications:
    get:
      tags: [Calendar]
      summary: การแจ้งเตือนล่าสุดของผู้ใช้ (สูงสุด 50) และจำนวนที่ยังไม่อ่าน
      description: |
        ระบบสร้างการแจ้งเตือนทุก 5 นาทีเมื่อถึงเวลา 08:00 น. (เวลาไทย) ของวันที่ต้องเตือน และเตือนแต่ละครั้งเพียงครั้งเดียว
        การแจ้งเตือนของวันสำคัญที่ผู้ใช้มองไม่เห็นแล้ว (เช่น ถูกเอาออกจากโปรเจกต์) จะไม่แสดง
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unread: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /notifications/read:
    post:
      tags: [Calendar]
      summary: ทำเครื่องหมายว่าอ่านแล้ว (ตามที่ระบุ หรือทั้งหมดเมื่อไม่ส่ง ids)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "204": { description: Done }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  headers:
    RefreshCookie:
      description: "taskflow_refresh=<random 256-bit token>; Path=/api/v1/auth; Max-Age=2592000; HttpOnly; Secure; SameSite=Strict"
      schema: { type: string }
  responses:
    Unauthorized:
      description: ไม่ได้ล็อกอินหรือ token ไม่ถูกต้อง
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: ไม่มีสิทธิ์ทำรายการ (เป็นสมาชิกแต่ไม่ใช่ Owner)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: ไม่พบ หรือไม่ใช่สมาชิกโปรเจกต์ (ไม่เปิดเผยว่ามีอยู่จริง)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: ข้อมูลซ้ำ
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validation:
      description: ข้อมูลไม่ถูกต้อง
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    RemindDays:
      type: array
      description: เตือนกี่วันก่อนวันสำคัญ (0 = วันนั้น) ไม่ซ้ำ เรียงจากน้อยไปมาก
      items: { type: integer, enum: [0, 1, 3, 7] }
    Person:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 120 }
        note: { type: string, maxLength: 1000 }
        day: { type: string, format: date }
        projectId: { type: string, format: uuid, nullable: true, description: "null = วันส่วนตัว" }
        projectName: { type: string, nullable: true }
        ownerId: { type: string, format: uuid, nullable: true, description: "เจ้าของวันส่วนตัว (null = วันของโปรเจกต์)" }
        createdBy: { type: string, format: uuid }
        remindDays: { $ref: "#/components/schemas/RemindDays" }
        sharedWith:
          type: array
          items: { $ref: "#/components/schemas/Person" }
          description: คนที่วันส่วนตัวแชร์ให้ บอกเฉพาะเจ้าของ คนอื่นได้ []
        sharedBy: { type: string, nullable: true, description: ชื่อเจ้าของ เมื่อวันนี้ถูกแชร์มาให้ผู้ใช้ }
        canEdit: { type: boolean, description: ผู้ใช้คนนี้แก้หรือลบได้ไหม }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EventCreate:
      type: object
      required: [title, day]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        note: { type: string, maxLength: 1000 }
        day: { type: string, format: date }
        projectId: { type: string, format: uuid }
        sharedWith: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        remindDays: { $ref: "#/components/schemas/RemindDays" }
    EventPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        note: { type: string, maxLength: 1000 }
        day: { type: string, format: date }
        remindDays: { $ref: "#/components/schemas/RemindDays" }
        sharedWith: { type: array, maxItems: 50, items: { type: string, format: uuid } }
    CalendarTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        startDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        assigneeIds:
          type: array
          items: { type: string, format: uuid }
          description: ผู้รับผิดชอบงาน ใช้กรองดูงานของคนใดคนหนึ่งในปฏิทิน
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        title: { type: string }
        day: { type: string, format: date }
        projectId: { type: string, format: uuid, nullable: true }
        projectName: { type: string, nullable: true }
        sharedBy: { type: string, nullable: true }
        daysBefore: { type: integer, enum: [0, 1, 3, 7] }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: รหัสข้อผิดพลาดที่ frontend ใช้แปลเป็นไทย/อังกฤษ
          enum: [unauthorized, invalid_credentials, forbidden, not_found, email_taken, already_member, validation_failed, bad_request, rate_limited, internal_error]
          example: not_found
        message: { type: string, description: ภาษาอังกฤษ สำหรับนักพัฒนา }
        fields:
          type: object
          additionalProperties: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        locale: { type: string, enum: [th, en] }
        theme: { type: string, enum: [light, dark] }
        createdAt: { type: string, format: date-time }
    UserSettingsPatch:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        locale: { type: string, enum: [th, en] }
        theme: { type: string, enum: [light, dark] }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: |
            อย่างน้อย 8 ตัวอักษร และไม่เกิน **72 ไบต์** (UTF-8) ตามข้อจำกัดของ bcrypt
            ตัวอักษรไทย 1 ตัวใช้ 3 ไบต์ จึงใส่รหัสผ่านไทยได้ไม่เกิน 24 ตัว
            ฟิลด์ผิดคืน `fields.password` = `password_too_short` หรือ `password_too_long`
        displayName: { type: string, minLength: 1, maxLength: 80 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 3600 }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        ownerId: { type: string, format: uuid }
        myRole: { type: string, enum: [owner, member] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        purgeAt:
          type: string
          format: date-time
          nullable: true
          description: เวลาที่จะถูกลบถาวร (deletedAt + 30 วัน) มีค่าเฉพาะรายการในถังขยะ
        taskCount: { type: integer, description: จำนวนงานที่ไม่อยู่ในถังขยะ }
        doneCount: { type: integer, description: ในนั้นมีกี่งานที่อยู่คอลัมน์ "เสร็จแล้ว" }
        memberCount: { type: integer, description: จำนวนสมาชิกทั้งหมด }
        members:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Person" }
          description: สมาชิก 5 คนแรก (เจ้าของก่อน แล้วตามเวลาที่เข้าร่วม)
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
    Member:
      type: object
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [owner, member] }
        joinedAt: { type: string, format: date-time }
    TaskStatus:
      type: string
      enum: [todo, in_progress, review, on_hold, done]
    Priority:
      type: string
      enum: [low, medium, high]
    Subtask:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        done: { type: boolean }
    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        holdReason:
          type: string
          nullable: true
          maxLength: 500
          description: สาเหตุที่พักงาน มีค่าเมื่อ status เป็น on_hold เท่านั้น
        assigneeIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        subtasks:
          type: array
          description: รายการย่อยตามลำดับ
          items: { $ref: "#/components/schemas/Subtask" }
        createdBy: { type: string, format: uuid }
        startDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true, description: วันที่สิ้นสุดงาน ต้องไม่อยู่ก่อน startDate }
        position: { type: number, format: double }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        purgeAt:
          type: string
          format: date-time
          nullable: true
          description: เวลาที่จะถูกลบถาวร (deletedAt + 30 วัน) มีค่าเฉพาะงานในถังขยะ
    TaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/Priority" }
        holdReason: { type: string, minLength: 1, maxLength: 500, description: จำเป็นเมื่อ status เป็น on_hold }
        assigneeIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        subtasks:
          type: array
          maxItems: 100
          description: ชื่อรายการย่อยตั้งต้นตามลำดับ
          items: { type: string, minLength: 1, maxLength: 200 }
        startDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true, description: วันที่สิ้นสุดงาน ต้องไม่อยู่ก่อน startDate }
    TaskPatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        priority: { $ref: "#/components/schemas/Priority" }
        holdReason: { type: string, minLength: 1, maxLength: 500, description: แก้ได้เฉพาะงานที่พักอยู่ }
        assigneeIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        startDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true, description: วันที่สิ้นสุดงาน ต้องไม่อยู่ก่อน startDate }

security:
  - bearerAuth: []
