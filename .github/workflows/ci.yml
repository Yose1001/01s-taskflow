name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway Postgres so database tests run in CI too. Test-only credentials, not a secret.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://taskflow:ci_test_only@localhost:5432/taskflow?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: migrate database
        run: |
          for f in migrations/*.up.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: test
        run: go test ./... -race -cover -count=1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # A real browser drives the real web app, Go API and database (see e2e/README.md).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # prepare-db.sh creates this database from scratch (it refuses any name that does not end in _e2e).
      E2E_DATABASE_URL: postgres://taskflow:ci_test_only@localhost:5432/taskflow_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/prepare-db.sh
      - run: pnpm exec playwright test
      # Screenshots, videos and traces of failed tests, so a failure can be looked at afterwards.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Builds the real container images, starts the whole system from them (docker-compose.prod.yml)
  # and checks that it works, then scans the images for known vulnerabilities.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: write throwaway secrets for this run only
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "IMAGE_TAG=ci"
          } > "$RUNNER_TEMP/prod.env"
      - name: build images and start the system
        run: docker compose --env-file "$RUNNER_TEMP/prod.env" -f docker-compose.prod.yml up -d --build
      - name: smoke test
        run: scripts/smoke-test.sh http://127.0.0.1:8088
      - name: show container logs if something failed
        if: failure()
        run: |
          docker compose --env-file "$RUNNER_TEMP/prod.env" -f docker-compose.prod.yml ps -a
          docker compose --env-file "$RUNNER_TEMP/prod.env" -f docker-compose.prod.yml logs --no-color --tail 60
      # Fails the build on HIGH / CRITICAL problems that already have a fix available.
      - name: scan images (api)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/yose1001/taskflow-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: scan images (web)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/yose1001/taskflow-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: scan images (migrate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/yose1001/taskflow-migrate:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Only after everything above passed, on main: publish the images to GitHub's container registry (GHCR),
  # tagged with the commit ("sha-1a2b3c4") and "latest". Pull requests never publish.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e, docker, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: backend, target: run }
          - { name: migrate, context: backend, target: migrate }
          - { name: web, context: frontend, target: run }
    steps:
      - uses: actions/checkout@v4
      - name: image name in lowercase (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/taskflow-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
